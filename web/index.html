        <p class="paper__authors">Abdullahi Mohamud Ahmed<sup>1</sup> &nbsp;and&nbsp; Abdulkadir Ugas<sup>1,2</sup></p>

    <section class="section">
        <h2 class="section__heading">Abstract</h2>
        <div class="abstract prose">
            <p>Somali NLP still has relatively few structured lexical resources that preserve the linguistic
            information found in traditional dictionaries. We present <strong>Qaamuuska-NLP</strong>, a
            machine-readable reconstruction of <em>Qaamuuska Af-Soomaaliga</em>, the 2012 monolingual Somali
            dictionary by Puglielli and Mansuur. The resource contains <strong>46,314 dictionary records</strong>
            extracted directly from the PDF's native text layer using a deterministic, rule-based pipeline,
            without OCR or machine-learning-based extraction. Where available in the source, records include part
            of speech, noun gender, verb class and transitivity, plural information, subject domains, synonym
            references, cross-references, homonym indices, and numbered definitions. The original entry text is
            retained alongside the parsed representation to support inspection against the source.</p>

            <p>We describe the extraction pipeline, the structure and coverage of the resulting resource, and the
            main classes of residual parsing errors. We also examine the distribution of grammatical and lexical
            information in the dictionary and use a simple surface-form prediction probe to test how strongly
            selected morphological labels are reflected in Somali word forms. Qaamuuska-NLP complements existing
            Somali morphological, lemmatization, corpus, and multi-dictionary lexical resources by preserving the
            structure of a single major monolingual dictionary in a reproducible computational form.</p>
        </div>
        <p class="keywords">Keywords &nbsp;&middot;&nbsp; Somali NLP &nbsp;&middot;&nbsp; computational lexicography
        &nbsp;&middot;&nbsp; lexical resources &nbsp;&middot;&nbsp; dictionary digitization
        &nbsp;&middot;&nbsp; morphology &nbsp;&middot;&nbsp; low-resource languages</p>
    </section>

    <section class="section">
        <h2 class="section__heading">The source dictionary</h2>
        <div class="prose">
            <p><em>Qaamuuska Af-Soomaaliga</em> (Dictionary of the Somali Language), edited by Annarita Puglielli
            and Cabdalla Cumar Mansuur and published by Roma Tre Press in 2012, is a major monolingual reference
            dictionary for Somali. Its entries contain more than headwords and definitions: they record
            grammatical categories, noun gender, verbal information, plural forms, semantic distinctions, subject
            labels, synonyms, homonyms, and cross-references.</p>

            <p>The dictionary is distributed as a fixed two-column PDF rather than a documented fielded dataset.
            Its text can be extracted digitally, but the lexical structure is expressed through typography,
            abbreviations, entry ordering, superscript markers, punctuation, and recurring conventions. Plain text
            extraction therefore does not directly provide records that can be searched by grammatical field,
            linked through cross-references, or used systematically in NLP pipelines.</p>

            <p>The extraction processes PDF pages 24&ndash;916 with <code>pdfplumber</code>, working from the
            native text layer rather than rendered page images.</p>
        </div>
    </section>

    <section class="section">
        <h2 class="section__heading">Extraction pipeline</h2>
        <ol class="pipeline">
            <li>
                <div>
                    <h3>Column-aware text extraction</h3>
                    <p>Each page is divided at its horizontal midpoint and the two columns are extracted
                    independently, left before right, so the intended reading order survives. Running headers are
                    removed with source-specific heuristics and the result is appended to a continuous buffer, so
                    entries spanning a page break are recovered intact.</p>
                </div>
            </li>
            <li>
                <div>
                    <h3>Entry segmentation</h3>
                    <p>Records are located using a recurring entry-start pattern: a headword, an optional
                    superscript homonym marker, then one of the dictionary's recognised part-of-speech codes. The
                    span between one entry start and the next becomes a candidate record body.</p>
                </div>
            </li>
            <li>
                <div>
                    <h3>Field parsing</h3>
                    <p>Each candidate is decomposed into headword, homonym index, original POS code, normalized
                    POS category, noun gender, verb conjugation class and transitivity, plural information,
                    parenthetical verbal information, subject-domain labels, numbered definitions, synonym
                    references and cross-references. Numbered definitions are kept separate rather than stored as
                    one undifferentiated string.</p>
                </div>
            </li>
            <li>
                <div>
                    <h3>Cross-reference resolution</h3>
                    <p>A second pass builds an index over the extracted headwords and connects each redirect
                    record &mdash; signalled in the source by markers such as <code>ld</code> and
                    <code>eeg</code> &mdash; to the integer identifier of its target, using the homonym marker
                    where the reference carries one.</p>
                </div>
            </li>
        </ol>
    </section>

    <section class="section">
        <h2 class="section__heading">Surface-form predictability of morphological labels</h2>
        <div class="prose">
            <p>As a diagnostic, a suffix back-off classifier &mdash; trained only on word-final character
            sequences of one to six characters, under an 80/20 <strong>headword-disjoint</strong> split &mdash;
            was asked to predict labels from the surface form alone. It receives no definition, dictionary
            metadata, contextual sentence, external corpus, or pretrained representation.</p>
        </div>
        <div class="table-wrap">
            <table class="data">
                <caption>Table 4 &mdash; surface-form prediction results</caption>
                <thead>
                    <tr>
                        <th>Task</th><th class="num">Records</th>
                        <th class="num">Majority acc.</th><th class="num">Suffix acc.</th><th class="num">Macro-F1</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Verb class (I&ndash;IV)</td><td class="num">11,444</td><td class="num">0.378</td><td class="num">0.935</td><td class="num">0.936</td></tr>
                    <tr><td>Noun gender (m/f/b)</td><td class="num">34,570</td><td class="num">0.538</td><td class="num">0.864</td><td class="num">0.874</td></tr>
                    <tr><td>POS (noun/verb/other)</td><td class="num">46,314</td><td class="num">0.746</td><td class="num">0.869</td><td class="num">0.560</td></tr>
                </tbody>
            </table>
        </div>
        <div class="prose" style="margin-top:26px">
            <p>Verb conjugation class and noun gender are strongly predictable from word-final morphology, which
            is consistent with the role of suffixation in Somali. Coarse part of speech behaves differently: the
            classifier improves accuracy from 0.746 to 0.869, but its macro-F1 is only 0.560, because nouns
            account for about 75% of records and the remaining categories represent a very small fraction of the
            lexicon.</p>
            <p>The experiment does <strong>not</strong> establish the accuracy of a Somali morphological analyzer
            on independent running text. It is a within-resource surface-form predictability analysis, not an
            extrinsic downstream evaluation.</p>
        </div>
    </section>

    <section class="section">
        <h2 class="section__heading">Limitations</h2>
        <div class="prose">
            <ul>
                <li>The resource derives from a <strong>single dictionary</strong>. Its coverage, sense
                distinctions, terminology, dialectal choices and grammatical conventions reflect the editorial
                decisions of <em>Qaamuuska Af-Soomaaliga</em> rather than a balanced sample of contemporary Somali
                usage.</li>
                <li>The pipeline is deliberately <strong>source-specific</strong>. Its rules depend on this
                dictionary's two-column layout, abbreviations, typography and entry patterns.</li>
                <li>Characters are preserved without a general Unicode normalization pass. More than one
                apostrophe code point occurs in the source, which affects exact headword matching, duplicate
                detection and cross-reference resolution. <em>This explorer folds those code points at query time,
                so both spellings find the same records.</em></li>
                <li>Residual artifacts remain and are reported rather than hidden: 957 redirects (4.6%) do not
                resolve, the <code>(headword, homonym_index)</code> pair collides for 88 records, and small
                fractions of definitions are empty, unusually short, or retain text resembling the start of an
                adjacent record.</li>
                <li>Annotations are monolingual and source-specific; they have not been mapped to Universal
                Dependencies or exported through TEI Lex-0 or OntoLex-Lemon.</li>
            </ul>
        </div>
    </section>

    <section class="section">
        <h2 class="section__heading">Ethics and data availability</h2>
        <div class="prose">
            <p>Qaamuuska-NLP is derived from <em>Qaamuuska Af-Soomaaliga</em>, a copyrighted monolingual Somali
            dictionary published by Roma Tre Press. The source dictionary is publicly accessible as a PDF, but
            public access does not by itself imply permission to redistribute its lexical content in a new
            structured form.</p>
            <p>Permission to publicly redistribute the complete extracted lexical dataset is
            <strong>pending</strong>. The released artifacts are the extraction code, aggregate statistics, and a
            small illustrative sample of records, at
            <a href="https://github.com/Ogaal-Labs/somali_dictionary_lexicon" target="_blank" rel="noopener">github.com/Ogaal-Labs/somali_dictionary_lexicon</a>.
            The extraction code is MIT-licensed; that license applies only to the software and does not extend to
            the lexical content of the source dictionary.</p>
            <p>The resource is intended for research and educational work in Somali language technology. It
            contains lexicographic material and no personal data, human-subject annotations, or information
            collected from individual participants.</p>
        </div>
    </section>
